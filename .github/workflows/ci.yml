name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,dev]"
      - run: ruff check .
      # mypy results depend on the NumPy stubs each interpreter resolves
      # (NumPy < 2.5 stubs are not clean under mypy 2.x), so the type check
      # runs once on the newest leg; ruff and pytest still run on every leg.
      - if: matrix.python-version == '3.12'
        run: mypy src/quasarlab
      - run: python -m pytest -q
