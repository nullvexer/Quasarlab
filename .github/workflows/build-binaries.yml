name: Build desktop executables

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: QuasarLab-windows-x64.exe
            binary: QuasarLab.exe
            pyi_args: --windowed
          - os: ubuntu-latest
            artifact: QuasarLab-linux-x64
            binary: QuasarLab
            # No --windowed on Linux: it only detaches stdio there, which
            # swallows every traceback and makes failures undiagnosable.
            # A frozen GUI app does not need it; console mode keeps the
            # smoke test self-diagnosing.
            pyi_args: ""
          - os: macos-latest
            artifact: QuasarLab-macos-arm64
            binary: QuasarLab
            pyi_args: --windowed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk runtime and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install package and PyInstaller
        run: python -m pip install -e ".[exe]"
      - name: Check build-interpreter tkinter (Linux)
        if: runner.os == 'Linux'
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - name: Check virtual-display Tk (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import tkinter; root = tkinter.Tk(); print('Tk', root.tk.call('info', 'patchlevel')); root.destroy()"
      - name: Source-level smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python quasarlab_gui.py --selftest
      - name: Build one-file executable
        run: >
          python -m PyInstaller --onefile ${{ matrix.pyi_args }} --collect-all sv_ttk
          --name QuasarLab quasarlab_gui.py
      - name: Smoke-test the executable (Windows)
        if: runner.os == 'Windows'
        run: .\dist\QuasarLab.exe --selftest
      - name: Smoke-test the executable (macOS)
        if: runner.os == 'macOS'
        run: ./dist/QuasarLab --selftest
      - name: Smoke-test the executable (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # setup-python exports LD_LIBRARY_PATH pointing at the build
          # interpreter's lib dir; mixed with the frozen bootloader's own
          # extraction dir it can resolve the wrong shared libraries.
          unset LD_LIBRARY_PATH
          xvfb-run -a ./dist/QuasarLab --selftest
      - name: Rename executable for the platform
        shell: bash
        run: cp "dist/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
      - name: Attach executables to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
