name: Build desktop executables

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: QuasarLab-windows-x64.exe
            binary: QuasarLab.exe
          - os: ubuntu-latest
            artifact: QuasarLab-linux-x64
            binary: QuasarLab
          - os: macos-latest
            artifact: QuasarLab-macos-arm64
            binary: QuasarLab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk runtime and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install package and PyInstaller
        run: python -m pip install -e ".[exe]"
      - name: Check build-interpreter tkinter (Linux)
        if: runner.os == 'Linux'
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - name: Build one-file executable
        run: >
          python -m PyInstaller --onefile --windowed --collect-all sv_ttk
          --name QuasarLab quasarlab_gui.py
      - name: Smoke-test the executable (Windows)
        if: runner.os == 'Windows'
        run: .\dist\QuasarLab.exe --selftest
      - name: Smoke-test the executable (macOS)
        if: runner.os == 'macOS'
        run: ./dist/QuasarLab --selftest
      - name: Smoke-test the executable (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./dist/QuasarLab --selftest || code=$?
          if [ "${code:-0}" -ne 0 ]; then
            echo "selftest exited with ${code}; selftest-error.log (if any):"
            cat selftest-error.log || true
            exit "${code:-1}"
          fi
      - name: Rename executable for the platform
        shell: bash
        run: cp "dist/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
      - name: Attach executables to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
